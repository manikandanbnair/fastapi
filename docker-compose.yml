services: 

  api:

    build: .

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    depends_on:
      - postgres
  
  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_db
    
    ports:
      - "5432:5432"
